name: Actualizar pronóstico
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pronóstico Open-Meteo
        # Si Open-Meteo no responde, se queda el pronóstico anterior y se reintenta en la próxima hora.
        continue-on-error: true
        timeout-minutes: 8
        run: python3 fetch_forecast.py forecast.new.json && mv forecast.new.json forecast.json
      - name: Lluvia por hora de Meteored
        continue-on-error: true
        run: python3 fetch_meteored.py forecast.json
      - name: Recomendación del día
        continue-on-error: true
        run: node recommend.js forecast.json > summary.txt && cat summary.txt
      - name: Guardar
        run: |
          git config user.name "praia-bot"
          git config user.email "praia-bot@users.noreply.github.com"
          git add forecast.json summary.txt
          git diff --cached --quiet || git commit -m "Pronóstico $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

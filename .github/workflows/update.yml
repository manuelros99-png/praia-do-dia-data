name: Actualizar pronóstico
on:
  schedule:
    - cron: "0 8 * * *"    # 5:00 en Rio
    - cron: "40 8 * * *"   # 5:40 en Rio, por si la primera se atrasa
    - cron: "0 15 * * *"   # 12:00 en Rio, para la tarde
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pronóstico Open-Meteo
        run: python3 fetch_forecast.py forecast.json
      - name: Lluvia por hora de Meteored
        continue-on-error: true
        run: python3 fetch_meteored.py forecast.json
      - name: Guardar
        run: |
          git config user.name "praia-bot"
          git config user.email "praia-bot@users.noreply.github.com"
          git add forecast.json
          git diff --cached --quiet || git commit -m "Pronóstico $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
